<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моделювання руху</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="settings">
        <h3>Налаштування</h3>
        <label for="startX">Початкове X: <input type="number" id="startX" value="0"></label>
        <label  for="startY">Початкове Y: <input type="number" id="startY" value="0"></label>
        <label for="angle">Кут (градуси): <input type="number" id="angle" value="45"></label>
        <label for="speed">Швидкість: <input type="number" id="speed" value="50"></label>
        <label for="gravity">Гравітація: <input type="number" id="gravity" value="9.8"></label>
        <label for="lineColor">Колір лінії: <input type="color" id="lineColor" value="#ff4500"></label>
        <button  id="startButton">Запустити</button>
        <button id="clearButton">Очистити</button>
        <button id="clearButton">Очистити</button>
    </div>
</div>

    <script src="3.js"></script>
</body>  
</html>
